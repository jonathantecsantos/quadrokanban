services:
  - type: web
    name: kanban-backend-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma db push
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kanban-postgres
          property: connectionString

databases:
  - name: kanban-postgres
    plan: free
    databaseName: kanban
    user: kanban_user
